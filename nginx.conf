server {
    listen       80;
    server_name  localhost;

    root   /data/webroot;
    index  index.html index.htm;

    # Everything in the webroot comes from an SFTP user, who can create
    # symlinks as well as files. A link to /etc/passwd (or any other
    # world-readable file in the container) would otherwise be served as if it
    # were part of the site. "on" refuses any path with a symlink in it (403).
    disable_symlinks on;

    location / {
    }

    # Dotfiles are deploy leftovers far more often than content: .env, .git/,
    # .htaccess with credentials in it. Answer 404 rather than 403 so their
    # existence is not confirmed.
    location ~ /\. {
        return 404;
    }

    # /.well-known/ is the exception (ACME challenges, security.txt), but only
    # the directory itself - dotfiles below it are still hidden. ^~ stops the
    # regex above from matching first.
    location ^~ /.well-known/ {
        location ~ ^/\.well-known/(.*/)?\. {
            return 404;
        }
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }

    # Health check endpoint for the HEALTHCHECK in the Dockerfile, which runs
    # inside the container against 127.0.0.1. stub_status reveals connection
    # counts, so nobody else gets it. "=" makes it an exact match - a prefix
    # match also answered /internal/healthxyz.
    location = /internal/health {
        allow 127.0.0.1;
        deny  all;
        stub_status on;
    }
}
