name: ci

on:
  push:
  pull_request:

# Read-only token: this workflow only builds and tests, and also runs for
# pull requests.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # nothing is pushed; do not leave the token in .git/config
        persist-credentials: false

    - name: install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: check shell syntax
      run: |
        sh -n entrypoint.sh
        sh -n ci/smoke-test.sh

    - name: lint shell scripts
      run: shellcheck entrypoint.sh ci/smoke-test.sh

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: build docker image
      run: docker build --pull --tag nginx-sftp:test .

    - name: smoke test built image
      timeout-minutes: 15
      run: ./ci/smoke-test.sh nginx-sftp:test
