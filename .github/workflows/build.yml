name: Build and Push Container

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository (full history for tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          echo "IMAGE=${IMAGE}"

          emit_tags() {
            {
              echo "skip=false"
              echo "tags<<TAGS_EOF"
              printf '%s\n' "$@"
              echo "TAGS_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "resolved tags: $*"
          }

          # Staging: every push to master moves :latest
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/master" ]]; then
            emit_tags "${IMAGE}:latest" "${IMAGE}:master-${SHORT_SHA}"
            exit 0
          fi

          # Anything that is not a tag (e.g. manual run on a branch): SHA only
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            emit_tags "${IMAGE}:${GITHUB_SHA}"
            exit 0
          fi

          # Releases: accept semver-like tags X.Y.Z with optional -prerelease or +build
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "TAG did NOT match semver -> skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force

          # Prerelease tags (e.g. 1.3.0-rc1) never carry :stable, even when they
          # sort above the newest release; they get their own image tag only.
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            emit_tags "${IMAGE}:${TAG}"
            exit 0
          fi

          # :stable tracks the newest plain release (sort -V is unambiguous
          # for X.Y.Z without prerelease suffixes)
          LATEST_TAG="$(git tag -l \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)"

          echo "LATEST_TAG=${LATEST_TAG}"

          if [[ "$TAG" == "$LATEST_TAG" ]]; then
            emit_tags "${IMAGE}:${TAG}" "${IMAGE}:stable"
          else
            emit_tags "${IMAGE}:${TAG}"
          fi

      - name: Set up QEMU
        if: steps.meta.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.meta.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.meta.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for smoke test
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: nginx-sftp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        if: steps.meta.outputs.skip != 'true'
        timeout-minutes: 15
        run: ./ci/smoke-test.sh nginx-sftp:smoke

      - name: Build and push image
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
