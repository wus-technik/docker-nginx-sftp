version: 2

updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # version comment together. One PR for all of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  # The Alpine base image is pinned by digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
