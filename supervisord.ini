[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=false
startretries=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
process_name=nginx
numprocs=1
stopasgroup=true
killasgroup=true

[program:sftp_server]
command=/usr/sbin/sshd -D -e
autorestart=false
startretries=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
process_name=sftp_server
numprocs=1
stopasgroup=true
killasgroup=true

; One listener is enough: it receives the exit events of every program and
; brings supervisord (and with it the container) down. The previous two
; listeners carried process_name=nginx/sftp_server, which only renamed the
; listener processes - it never filtered events - and made the log read as if
; each service had been started twice.
[eventlistener:service_exit]
command=/docker_kill.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
